[build]
  base = "package"
  command = "npm ci && npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

# API proxy — must be above the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "https://starpolice-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://starpolice-api.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA routing for React Router (/admin/dashboard, /student/login, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
