# Render Blueprint — permanent API with MongoDB in Docker
services:
  - type: web
    name: starpolice-api
    runtime: docker
    rootDir: server
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CLIENT_URL
        value: https://starpolice-panel.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
