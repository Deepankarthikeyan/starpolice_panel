name: Deploy API to Render

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "render.yaml"
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set."
            echo "Add it from Render → starpolice-api → Settings → Deploy Hook"
            exit 0
          fi

          echo "Triggering Render deploy for starpolice-api..."
          if ! curl -fsS -X POST "$RENDER_DEPLOY_HOOK"; then
            echo "::error::Render deploy hook failed. Check Render → starpolice-api → Events."
            exit 1
          fi
          echo ""
          echo "Render deploy started."

      - name: Wait for updated health check
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_URL: ${{ secrets.VITE_API_URL }}
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Skipping health check because RENDER_DEPLOY_HOOK is not configured."
            exit 0
          fi

          API_URL="${RENDER_API_URL:-https://starpolice-api.onrender.com}"
          EXPECTED_SHORT="${EXPECTED_BUILD:0:7}"
          echo "Waiting for $API_URL/api/health to report build $EXPECTED_SHORT..."

          for attempt in $(seq 1 45); do
            if response=$(curl -fsS "$API_URL/api/health" 2>/dev/null); then
              if echo "$response" | grep -q '"setupRequired"'; then
                echo "::warning::API is up but MONGODB_URI is not configured on Render. Add MongoDB Atlas URI (see HOSTING.md)."
                echo "$response"
                exit 0
              fi

              if echo "$response" | grep -q '"database"[[:space:]]*:[[:space:]]*"mongodb"'; then
                if echo "$response" | grep -q "\"build\"[[:space:]]*:[[:space:]]*\"$EXPECTED_SHORT\""; then
                  echo "API ready with expected build: $response"
                  exit 0
                fi
                current_build=$(echo "$response" | sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
                echo "Attempt $attempt: API up but build is $current_build (expected $EXPECTED_SHORT)"
              else
                echo "Attempt $attempt: API up, database not ready yet ($response)"
              fi
            else
              echo "Attempt $attempt: API not reachable yet"
            fi
            sleep 20
          done

          echo "::error::Render did not deploy commit $EXPECTED_SHORT. Open Render → starpolice-api → Manual Deploy → Deploy latest commit."
          exit 1
