name: Deploy frontend to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package/package-lock.json

      - name: Install and build
        working-directory: package
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            SITE_REF="${NETLIFY_SITE_ID:-starpolice-panel}"
            echo "Deploying with Netlify CLI (site: $SITE_REF)..."
            npx netlify-cli@17 deploy \
              --prod \
              --dir package/dist \
              --site "$SITE_REF" \
              --auth "$NETLIFY_AUTH_TOKEN" \
              --message "Deploy from GitHub Actions (${GITHUB_SHA:0:7})"
            exit 0
          fi

          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            echo "Triggering Netlify build hook..."
            curl -fsS -X POST -d {} "$NETLIFY_BUILD_HOOK"
            exit 0
          fi

          echo "::error::No Netlify deploy credentials configured."
          echo "Add NETLIFY_AUTH_TOKEN to GitHub repo secrets:"
          echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "Create a token at:"
          echo "https://app.netlify.com/user/applications#personal-access-tokens"
          exit 1
