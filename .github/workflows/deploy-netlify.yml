name: Deploy frontend to Netlify

on:
  push:
    branches: [master]
    paths:
      - "package/**"
      - "netlify.toml"
      - ".github/workflows/deploy-netlify.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package/package-lock.json

      - name: Install and build
        working-directory: package
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Verify Netlify credentials
        id: netlify_creds
        run: |
          if [ -n "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "mode=hook" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] && [ -n "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Netlify deploy credentials found. Skipping deploy."
            echo "Add NETLIFY_BUILD_HOOK (recommended) or NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID."
            echo "Or trigger a deploy from: https://app.netlify.com/projects/starpolice-panel"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Netlify build hook
        if: steps.netlify_creds.outputs.ready == 'true' && steps.netlify_creds.outputs.mode == 'hook'
        run: curl -fsS -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"

      - name: Deploy to Netlify
        if: steps.netlify_creds.outputs.ready == 'true' && steps.netlify_creds.outputs.mode == 'cli'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./package/dist"
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
